
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi</title>
    <link rel="stylesheet" href="transaksi.css">
</head>
<body>
    <aside>
        <h1>Kasir</h1>

        <nav>
            <a href="../dashboard/dashboard.html" id="dashboard">Dashboard</a>
            <a href="#" id="transaksi">Transaksi</a>
            <a href="#" id="riwayatTransaksi">Riwayat Transaksi</a>
            <a href="#" id="produk">Produk</a>
            <a href="#" id="logout">Log Out</a>
        </nav>
    </aside>


    <main>
        <header>
            <h2>Transaksi Penjualan</h2>
            <span id="tanggal">Tanggal</span>
        </header>


        <section class="cariProduk">
            <h3>Cari Produk</h3>
            <input type="text" id="cariProduk" placeholder="Masukkan nama produk...">
            <button id="btnCari">Cari</button>
        </section>


        <section class="daftarProduk">
            <h3>Daftar Produk</h3>
            <div id="produkList">


            </div>
        </section>

        <section class="keranjang">
            <h3>Keranjang Belanja</h3>

            <table>
                <thead>
                    <tr>
                        <th>Nama Produk</th>
                        <th>Harga</th>
                        <th>Jumlah</th>
                        <th>Subtotal</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="keranjangList">

                </tbody>
            </table>

            <h3 id="totalBelanja">Total: Rp0</h3>
        </section>

        <section class="pembayaran">
            <h3>Pembayaran</h3>

            <label for="uangBayar">Uang Bayar</label>
            <input type="number" id="uangBayar" placeholder="Masukkan nominal pembayaran">
            <p id="kembalian">Kembalian: Rp0</p>

            <button id="btnBayar">Bayar Transaksi</button>
        </section>
    </main>

    <script src="transaksi.js"></script>
</body>
</html>

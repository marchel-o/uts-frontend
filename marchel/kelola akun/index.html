<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/components/sidebar.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Kelola Akun</title>
</head>
<body>
  <div id="bg-elem"></div>
  <div id="overlay"></div>

  <button class="menu-toggle" id="menuToggle" aria-label="Buka menu" aria-expanded="false">
    ☰ Menu
  </button>

  <div id="sidebar-container"></div>

  <main>

    <div id="head-title">
      <h3>Kelola Akun</h3>
    </div>
  
    <button id="tambah-akun-btn">Tambah Akun</button>
  
    <div id="list-akun">
      <div class="card-akun">
        <p>Antonius Budi</p>
        
        <div>
          <p>Kasir 1</p>
          <div class="icon-btn">
            <i class="fa-solid fa-trash delete-btn"></i>
          </div>
        </div>
      </div>
  
      <div class="card-akun">
        <p>Budi Santoso</p>
        
        <div>
          <p>Kasir 2</p>
          <div class="icon-btn">
            <i class="fa-solid fa-trash delete-btn"></i>
          </div>
        </div>
      </div>
  
      <div class="card-akun">
        <p>Saroso Budius</p>
        
        <div>
          <p>Kasir 3</p>
          <div class="icon-btn">
            <i class="fa-solid fa-trash delete-btn"></i>
          </div>
        </div>
      </div>
  
      <div id="delete-container">
        <p>Hapus akun <span id="delete-nama"></span>?</p>
        <div>
          <button class="cancel">Tidak</button>
          <button class="continue">Iya</button>
        </div>
      </div>
  
      <div id="edit-container">
        <p>Nama</p>
        <p>Kasir</p>
        <div>
          <button class="cancel">Batal</button>
          <button class="continue">Simpan</button>
        </div>
      </div>
  
    </div>

    <form id="tambah-akun-form">
      <p>Nama</p>
      <input type="text" />

      <button>Tambah</button>
    </form>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/components/sidebar.js"></script>
  <script src="app.js"></script>
</body>
</html>

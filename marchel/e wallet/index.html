<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../global.css">
  <title>E-Wallet</title>
</head>
<body>
  <form id="topup-ewallet-form">
    <h3>Top Up E-Wallet</h3>
  
    <p>Provider</p>
    <select>
      <option>GoPay</option>
      <option>OVO</option>
      <option>Dana</option>
      <option>ShopeePay</option>
      <option>LinkAja</option>
    </select>
  
    <p>Nomor Akun</p>
    <input type="text" />
  
    <p>Nominal</p>
    <input type="number" />
  
    <!-- <p>Harga: 50.000</p>
    <p>Admin: 2.500</p>
    <p>Total: 52.500</p> -->
  
    <div>
      

      <div class="price-item">
        <p>Harga:</p>
        <p>50.000</p>
      </div>
  
      <div class="price-item">
        <p>Admin:</p>
        <p>2.500</p>
      </div>
  
      <div class="bold-line"></div>
      
      <div class="price-item">
        <p>Total:</p>
        <p>52.500</p>
      </div>
    </div>
  
    <button>Bayar</button>
  </form>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>

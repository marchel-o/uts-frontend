<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../global.css">
  <title>Kartu Kredit</title>
</head>
<body>
  <div id="bg-elem"></div>
  <div id="overlay"></div>

  <div id="head-title">
    <a href="../../ppob/index.html" class="fa-solid fa-angle-left"></a>
    <h3>Kartu Kredit</h3>
  </div>

  <form id="kredit-form">
    <div>
      <label for="kredit-bank">Bank</label>
      <select required name="kredit-bank" id="kredit-bank">
        <option value="" disabled selected hidden>Pilih Bank</option>
        <option value="BCA">BCA</option>
        <option value="Mandiri">Mandiri</option>
        <option value="CIMB Niaga">CIMB Niaga</option>
        <option value="BRI">BRI</option>
        <option value="BNI">BNI</option>
      </select>
    </div>
  
    <div>
      <label for="kredit-nomor">Nomor Kartu</label>
      <input type="text" name="kredit-nomor" id="kredit-nomor" maxlength="13" required />
    </div>

    <button type="submit">Bayar</button>
  </form>

  <div id="kredit-result">
    <h4>Konfirmasi</h4>

    <div class="price-item">
      <p>Bank:</p>
      <p id="bank-val"></p>
    </div>

    <div class="price-item">
      <p>No. Kartu</p>
      <p id="nomor-val"></p>
    </div>

    <div class="price-item">
      <p>Harga:</p>
      <p id="price-val">300.000</p>
    </div>

    <div class="price-item">
      <p>Admin:</p>
      <p>2.500</p>
    </div>

    <div class="line"></div>
    
    <div class="price-item">
      <p>Total:</p>
      <p id="total-val"></p>
    </div>

    <div>
      <button id="cancel">Batal</button>
      <button id="pay">Bayar</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>

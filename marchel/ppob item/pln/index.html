<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../global.css">
  <title>PLN</title>
</head>
<body>
  <div id="bg-elem"></div>
  <div id="overlay"></div>

  <div id="head-title">
    <a href=".." class="fa-solid fa-angle-left"></a>
    <h3>PLN</h3>
  </div>

  <form id="pln-form">
    <div>
      <label for="pln-jenis">Jenis PLN</label>
      <select id="pln-jenis" required>
        <option value="" disabled selected hidden>Pilih Jenis PLN</option>
        <option value="PLN Nontaglis">PLN Nontaglis</option>
        <option value="PLN Pascabayar">PLN Pascabayar</option>
        <option value="PLN Prabayar">PLN Prabayar</option>
      </select>
    </div>
  
    <div>
      <label for="pln-nomor">No. Registrasi</label>
      <input id="pln-nomor" name="pln-nomor" type="text" required />
    </div>

    <button type="submit">Cek Tagihan</button>
  </form>


  <form id="pln-result">
    <h4>Konfirmasi</h4>

    <div>
      <p>Jenis PLN</p>
      <p id="jenis-val">PLN Nontaglis</p>
    </div>

    <div>
      <p>No. Registrasi</p>
      <p id="registrasi-val">54318796487</p>
    </div>

    <div>
      <p>Nama</p>
      <p>Kulius Fulouis</p>
    </div>
    
    <div>
      <p>Alamat</p>
      <p>Jl. Bumi 25</p>
    </div>
    
    <div>
      <p>Periode</p>
      <p>2027</p>
    </div>

    <div>
      <p>Harga</p>
      <p>50.000.000</p>
    </div>

    <div>
      <p>Admin</p>
      <p>2.500</p>
    </div>

    <div class="line"></div>

    <div>
      <p>Total</p>
      <p id="total-val"></p>
    </div>

    <div>
      <button id="cancel">Batal</button>
      <button id="pay">Bayar</button>
    </div>
  </form>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/components/sidebar.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Air</title>
</head>
<body>
  <div id="bg-elem"></div>
  <div id="overlay"></div>
  
  <button class="menu-toggle" id="menuToggle" aria-label="Buka menu" aria-expanded="false">
    ☰ Menu
  </button>

  <div id="sidebar-container"></div>

  <main>
    <div id="head-title">
      <h3>Paket Data</h3>
    </div>
  
    <form>
      <div id="nomor-container">
        <label for="data-nomor">Nomor Akun</label>
        <input type="text" name="data-nomor" id="data-nomor" maxlength="13" required />
      </div>
  
      <div id="list-data">
        <button class="data-item" type="button">
          <p>FlexMax 7GB, 28 Hari</p>
          <p>IDR <span class="harga-data">15.000</span></p>
        </button>
        <button class="data-item" type="button">
          <p>FlexMax 7GB, 28 Hari</p>
          <p>IDR <span class="harga-data">35.000</span></p>
        </button>
        <button class="data-item" type="button">
          <p>FlexMax 7GB, 28 Hari</p>
          <p>IDR <span class="harga-data">50.000</span></p>
        </button>
        <button class="data-item" type="button">
          <p>FlexMax 7GB, 28 Hari</p>
          <p>IDR <span class="harga-data">60.000</span></p>
        </button>
  
      </div>
    </form>
  
    <div id="continue-container">
      <div>
        <p>Total</p>
        <p id="continue-harga">35.000</p>
      </div>
      
      <button>Lanjut</button>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/components/sidebar.js"></script>
  <script src="app.js"></script>
</body>
</html>

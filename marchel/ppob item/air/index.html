<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/components/sidebar.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Air</title>
</head>
<body>
  <div id="bg-elem"></div>
  <div id="overlay"></div>
  <button class="menu-toggle" id="menuToggle" aria-label="Buka menu" aria-expanded="false">
    ☰ Menu
  </button>

  <div id="sidebar-container"></div>

  <main>
    <div id="head-title">
      <h3>Air</h3>
    </div>
  
    <form id="air-form">
      <div>
        <label for="air-wilayah">Wilayah</label>
        <select required name="air-wilayah" id="air-wilayah">
          <option value="" disabled selected hidden>Pilih Wilayah</option>
          <option value="Jakarta">Jakarta</option>
          <option value="Aceh">Aceh</option>
          <option value="Medan">Medan</option>
          <option value="Bekasi">Bekasi</option>
          <option value="Bogor">Bogor</option>
        </select>
      </div>
    
      <div>
        <label for="air-nomor">Nomor Pelanggan</label>
        <input type="text" name="air-nomor" id="air-nomor" maxlength="13" required />
      </div>
  
      <button type="submit">Bayar</button>
    </form>
  
    <div id="air-result">
      <h4>Konfirmasi</h4>
  
      <div class="price-item">
        <p>Wilayah:</p>
        <p id="wilayah-val"></p>
      </div>
  
      <div class="price-item">
        <p>No. Pelanggan</p>
        <p id="nomor-val"></p>
      </div>
  
      <div class="price-item">
        <p>Harga:</p>
        <p id="price-val">300.000</p>
      </div>
  
      <div class="price-item">
        <p>Admin:</p>
        <p>2.500</p>
      </div>
  
      <div class="line"></div>
      
      <div class="price-item">
        <p>Total:</p>
        <p id="total-val"></p>
      </div>
  
      <div>
        <button id="cancel">Batal</button>
        <button id="pay">Bayar</button>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/components/sidebar.js"></script>
  <script src="app.js"></script>
</body>
</html>

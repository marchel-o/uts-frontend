<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/components/sidebar.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>E-Wallet</title>
</head>
<body>
  <div id="bg-elem"></div>

  <button class="menu-toggle" id="menuToggle" aria-label="Buka menu" aria-expanded="false">
    ☰ Menu
  </button>

  <div id="sidebar-container"></div>

  <main>
    <div id="head-title">
      <h3>Pulsa</h3>
    </div>
  
    <form>
      <div id="nomor-container">
        <label for="pulsa-nomor">Nomor Akun</label>
        <input type="text" name="pulsa-nomor" id="pulsa-nomor" maxlength="13" required />
      </div>
  
      <div id="list-pulsa">
        <button class="pulsa-item" type="button">
          Pulsa <span class="harga-pulsa">15.000</span>
        </button>
        <button class="pulsa-item" type="button">
          Pulsa <span class="harga-pulsa">20.000</span>
        </button>
        <button class="pulsa-item" type="button">
          Pulsa <span class="harga-pulsa">30.000</span>
        </button>
        <button class="pulsa-item" type="button">
          Pulsa <span class="harga-pulsa">50.000</span>
        </button>
  
      </div>
    </form>

    <div id="continue-container">
      <div>
        <p>Total</p>
        <p id="continue-harga"></p>
      </div>
      
      <button>Lanjut</button>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/components/sidebar.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../global.css">
  <title>Pulsa & Data</title>
</head>
<body>
  <form id="topup-pulsa-form">
    <h3>Top Up Pulsa</h3>

    <div id="nomor-hp">
      <label for="nomor-hp" id="label-nomor-hp">Nomor HP</label>
      <input type="number" name="nomor-hp" id="input-nomor-hp" />
    </div>
    
    <div id="list-pulsa">
      <div class="pulsa-item">
        <p>5.000</p>
        <button>Tambah</button>
      </div>
      <div class="pulsa-item">
        <p>10.000</p>
        <button>Tambah</button>
      </div>
      <div class="pulsa-item">
        <p>20.000</p>
        <button>Tambah</button>
      </div>
      <div class="pulsa-item">
        <p>50.000</p>
        <button>Tambah</button>
      </div>
      <div class="pulsa-item">
        <p>100.000</p>
        <button>Tambah</button>
      </div>
      <div class="pulsa-item">
        <p>150.000</p>
        <button>Tambah</button>
      </div>
      <div class="pulsa-item">
        <p>200.000</p>
        <button>Tambah</button>
      </div>
      <div class="pulsa-item">
        <p>300.000</p>
        <button>Tambah</button>
      </div>
    </div>

    <p>150.000</p>

    <button type="submit">Top Up</button>
  </form>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>

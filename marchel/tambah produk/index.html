<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/global.css">
  <link rel="stylesheet" href="/components/sidebar.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Produk</title>
</head>
<body>
  <div id="bg-elem"></div>
  <button class="menu-toggle" id="menuToggle" aria-label="Buka menu" aria-expanded="false">
    ☰ Menu
  </button>

  <div id="sidebar-container"></div>

  <main>
    <div id="head-title">
      <h3>Tambah Produk</h3>
    </div>
  
    <form id="tambah-produk-form">
      <div>
        <label for="produk-nama">Nama Produk</label>
        <input id="produk-nama" name="produk-nama" type="text" required />
      </div>
      
      <div>
        <label for="produk-deskripsi">Deskripsi</label>
        <textarea id="produk-deskripsi" name="produk-deskripsi" required></textarea>
      </div>
  
      <div class="produk-items">
        <div>
          <label for="produk-kategori">Kategori</label>
          <select id="produk-kategori" name="produk-kategori" required>
            <option value="" disabled selected hidden>Pilih Kategori</option>
            <option value="Makanan">Makanan</option>
            <option value="Minuman">Minuman</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
    
        <div>
          <label for="produk-harga">Harga</label>
          <input id="produk-harga" name="produk-harga" type="number" required />
        </div>
      </div>
      
      <div class="produk-items">
        <div>
          <label for="produk-stock">Stock</label>
          <input id="produk-stock" name="produk-stock" type="number" required />
        </div>
    
        <div>
          <label for="produk-gambar">Gambar</label>
          <input type="file" id="produk-gambar" name="produk-gambar" />
        </div>
      </div>
  
      <button type="submit">Tambah Produk</button>
    </form>
  
    <div id="modal-popup">
      <p>Produk berhasil ditambah!</p>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/components/sidebar.js"></script>
  <script src="app.js"></script>
</body>
</html>

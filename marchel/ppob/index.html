<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../global.css">
  <title>E-Wallet</title>
</head>
<body>
  <div id="bg-elem"></div>

  <div id="head-title">
    <a href=".." class="fa-solid fa-angle-left"></a>
    <h3>PPOB</h3>
  </div>

  <div class="ppob-kategori">
    <p>Telekomunikasi</p>

    <div class="list-kategori">
      <div class="item-kategori">
        <i class="fa-solid fa-mobile-screen"></i>
        <p>Pulsa</p>
      </div>
    
      <div class="item-kategori">
        <i class="fa-solid fa-wifi"></i>
        <p>Data</p>
      </div>
    </div>
  </div>

  <div class="ppob-kategori">
    <p>Tagihan</p>

    <div class="list-kategori">
      <div class="item-kategori">
        <i class="fa-solid fa-bolt-lightning"></i>
        <p>PLN</p>
      </div>

      <div class="item-kategori">
        <i class="fa-solid fa-droplet"></i>
        <p>Air</p>
      </div>

    </div>
  </div>

  <div class="ppob-kategori">
    <p>Keuangan</p>

    <div class="list-kategori">
      <div class="item-kategori">
        <i class="fa-solid fa-wallet"></i>
        <p>E-Wallet</p>
      </div>

      <div class="item-kategori">
        <i class="fa-solid fa-credit-card"></i>
        <p>Kartu Kredit</p>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>

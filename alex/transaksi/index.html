<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi Berhasil - Kasir</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../../components/sidebar.css">
    <link rel="stylesheet" href="../kasir.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="menuToggle" class="menu-toggle" aria-expanded="false">☰ Menu</button>
    <div id="sidebar-container"></div>

    <main>
        <h1 class="noprint">Transaksi Berhasil</h1>
        <div id="content" class="two-col">
            <section class="stack noprint">
                <div class="change"><span id="lbl">Kembalian</span><b id="kembali"></b></div>

                <div class="card">
                    <label for="tujuan">Kirim struk digital</label>
                    <input id="tujuan" placeholder="Email atau nomor WhatsApp (08xxxxxxxxxx)" autocomplete="off">
                    <p id="msg" class="err" role="alert"></p>
                    <button id="kirim" class="btn block">Kirim struk digital</button>
                </div>

                <div class="actions">
                    <button id="cetak" class="btn pri">Cetak struk</button>
                    <a class="btn" href="../cari-barang/index.html">Transaksi baru</a>
                    <a id="void" class="btn" href="../void/index.html">Void transaksi ini</a>
                </div>
            </section>

            <aside id="struk" class="card struk"></aside>
        </div>
    </main>

    <script src="../../components/sidebar.js"></script>
    <script src="../kasir.js"></script>
    <script src="app.js"></script>
</body>
</html>

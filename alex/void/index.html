<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Transaksi - Kasir</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../../components/sidebar.css">
    <link rel="stylesheet" href="../kasir.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="menuToggle" class="menu-toggle" aria-expanded="false">☰ Menu</button>
    <div id="sidebar-container"></div>

    <main>
        <h1>Void Transaksi</h1>
        <p class="hint">Pembatalan pesanan wajib disetujui supervisor dengan PIN.</p>
        <div class="two-col">
            <section class="card">
                <label for="pilih">Pesanan yang dibatalkan</label>
                <select id="pilih"></select>

                <label for="alasan">Alasan pembatalan</label>
                <textarea id="alasan" rows="2" placeholder="Contoh: pelanggan batal beli, salah input barang"></textarea>

                <label for="pin">PIN supervisor</label>
                <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="6 digit" autocomplete="off">

                <p id="msg" class="err" role="alert"></p>
                <button id="void" class="btn bad block">Void transaksi</button>
            </section>

            <aside class="card struk">
                <h2>Detail pesanan</h2>
                <div id="detail"></div>
            </aside>
        </div>
    </main>

    <script src="../../components/sidebar.js"></script>
    <script src="../kasir.js"></script>
    <script src="app.js"></script>
</body>
</html>

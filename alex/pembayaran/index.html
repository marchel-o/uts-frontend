<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran - Kasir</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../../components/sidebar.css">
    <link rel="stylesheet" href="../kasir.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="menuToggle" class="menu-toggle" aria-expanded="false">☰ Menu</button>
    <div id="sidebar-container"></div>

    <main>
        <h1>Pembayaran</h1>
        <div id="content" class="two-col">
            <section class="stack">
                <div class="total"><span>Total belanja</span><b id="tot"></b></div>

                <fieldset class="methods">
                    <label><input type="radio" name="m" value="Tunai" checked>Tunai</label>
                    <label><input type="radio" name="m" value="QRIS">QRIS</label>
                    <label><input type="radio" name="m" value="Kartu">Kartu</label>
                </fieldset>

                <div id="p-Tunai" class="card">
                    <label for="uang">Uang diterima</label>
                    <input id="uang" inputmode="numeric" placeholder="0" autocomplete="off">
                    <div id="quick" class="quick"></div>
                    <p id="selisih" class="hint" aria-live="polite"></p>
                </div>

                <div id="p-QRIS" class="card" hidden>
                    <div class="qr" role="img" aria-label="Contoh kode QRIS"></div>
                    <p class="hint">Minta pelanggan scan kode di atas.</p>
                    <label class="check"><input type="checkbox" id="qrisok"> Pembayaran sudah diterima di layar</label>
                </div>

                <div id="p-Kartu" class="card" hidden>
                    <label for="jenis">Jenis kartu</label>
                    <select id="jenis">
                        <option>Debit</option>
                        <option>Kredit</option>
                    </select>
                    <label for="kartu4">4 digit terakhir kartu</label>
                    <input id="kartu4" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off">
                </div>

                <div>
                    <p id="err" class="err" role="alert"></p>
                    <button id="proses" class="btn pri block">Proses pembayaran</button>
                </div>
            </section>

            <aside class="card struk">
                <h2>Ringkasan pesanan</h2>
                <div id="cart"></div>
                <a class="btn block" href="../cari-barang/index.html">Ubah pesanan</a>
            </aside>
        </div>
    </main>

    <script src="../../components/sidebar.js"></script>
    <script src="../kasir.js"></script>
    <script src="app.js"></script>
</body>
</html>

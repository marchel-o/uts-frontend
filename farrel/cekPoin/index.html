<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cek Poin Member</title>
    <link rel="stylesheet" href="style.css" />
   <link rel="stylesheet" href="../../global.css" />
  </head>
  <body>
    <div id="bg-elem"></div>
    <div id="overlay"></div>
    <div class="page">
      <h3>Cek Poin Member</h3>
      <p class="desc">
        Scan kartu member dan penukaran poin dengan barang/diskon.
      </p>
      <div class="card">
        <div class="scan-row">
          <input
            id="sq"
            placeholder="No. HP yang didaftarkan saat Pendaftaran Member"
          />
          <button type="button" class="btn" onclick="searchMember()">
            Cari
          </button>
        </div>
        <div class="result" id="member-result" style="display: none"></div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>

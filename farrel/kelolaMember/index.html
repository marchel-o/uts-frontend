<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kelola Member</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../global.css" />
    <link rel="stylesheet" href="../../components/sidebar.css" />
  </head>
  <body>
    <div id="sidebar-container"></div>
    <div id="bg-elem"></div>
    <div id="overlay"></div>
    <div class="page" style="max-width: 820px">
      <h3>Kelola Member</h3>
      <p class="desc">
        Cari, cek poin, ubah status, dan kelola data seluruh member.
      </p>
      <p class="desc" style="margin-top: -18px; font-size: 13px">
        Rate: Rp1.000 belanja = 1 poin · Tukar 100 poin = diskon Rp1.000
      </p>
      <div class="card">
        <div class="scan-row" style="margin-bottom: 16px">
          <input
            id="search-box"
            placeholder="Cari nama atau No. HP..."
            oninput="renderMembers()"
          />
        </div>
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>No. HP</th>
              <th>Tgl Lahir</th>
              <th>Tgl Daftar</th>
              <th>Status</th>
              <th>Poin</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="member-rows"></tbody>
        </table>
      </div>
    </div>
    <script src="app.js"></script>
    <script src="/components/sidebar.js"></script>
  </body>
</html>

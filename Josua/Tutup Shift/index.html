<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tutup Shift (Close Register)</title>
  <link rel="stylesheet" href="../../global.css">
  <link rel="stylesheet" href="/components/sidebar.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="sidebar-container"></div>
  <button id="menuToggle" class="menu-toggle" aria-expanded="false">☰ Menu</button>

  <div id="bg-elem"></div>
  <div id="overlay"></div>

  <main class="main">
    <h2>Tutup Shift (Close Register)</h2>

    <p class="sub">
      Hitung uang fisik di laci. Total sistem disembunyikan sampai Anda mengirim (blind close).
    </p>

    <div class="card">
      <div class="grid" id="denoms"></div>

      <div class="total">
        Total hitungan: <span id="countTotal">Rp 0</span>
      </div>

      <button type="button" class="btn" id="closeBtn">
        Kirim &amp; tutup shift
      </button>

      <div id="closeMsg" class="msg" hidden></div>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="/components/sidebar.js"></script>
</body>
</html>

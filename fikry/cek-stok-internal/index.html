<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Stok Internal</title>
  <link rel="stylesheet" href="../../global.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../components/sidebar.css">
</head>

<body>
  <div id="bg-elem"></div>
  <div id="overlay"></div>
    <button class="menu-toggle" id="menuToggle" aria-label="Buka menu" aria-expanded="false">
        ☰ Menu
    </button>

    <div id="sidebar-container"></div>

  <div id="main-content">
      <header id="head-title">
            <nav type="button" aria-label="Kembali ke manajemen stok">
                <a href="../../kelvin/dashboard/dashboard.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
            </nav>
            <h1>Cek Stok Internal</h1>
        </header>

      <main>
        <search>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="cari-barang" type="search" placeholder="Cari nama atau kode barang..." aria-label="Cari barang"
            autocomplete="off" autofocus>
        </search>

        <table>
          <thead>
            <tr>
              <th scope="col">Kode</th>
              <th scope="col">Nama Barang</th>
              <th scope="col">Stok Rak</th>
              <th scope="col">Stok Gudang</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <p id="kosong" hidden>Tidak ada barang yang cocok.</p>
      </main>
  </div>

  <script src="script.js"></script>
  <script src="../../components/sidebar.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retur Barang</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="bg-elem"></div>

    <header id="head-title">
        <nav type="button" aria-label="Kembali ke manajemen stok">
            <a href="../../kelvin/dashboard/dashboard.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
        </nav>
        <h1>Retur Barang</h1>
    </header>

    <main>
        <section>
            <form id="form-dokumen" novalidate>
                <label>No. Faktur Asal
                    <input name="faktur" type="text" placeholder="Contoh: INV-2026-001" autocomplete="off" required>
                </label>
                <label>Tanggal Retur
                    <input name="tanggal" type="date" required>
                </label>
                <label>Supplier
                    <select name="supplier" required>
                        <option value="" selected disabled>Pilih supplier</option>
                    </select>
                </label>
            </form>
        </section>

        <section>
            <form id="form-barang" novalidate>
                <label>Kode Barang
                    <input name="kode" type="text" placeholder="Contoh: BRG-001" autocomplete="off" required>
                </label>
                <label>Jumlah
                    <input name="jumlah" type="number" min="1" step="1" inputmode="numeric" placeholder="0" required>
                </label>
                <label>Alasan Retur
                    <select name="alasan" required>
                        <option value="" selected disabled>Pilih alasan</option>
                    </select>
                </label>
                <button type="submit">Tambah ke List</button>
            </form>

            <table>
                <thead>
                    <tr>
                        <th scope="col">Kode</th>
                        <th scope="col">Jumlah</th>
                        <th scope="col">Alasan Retur</th>
                        <th scope="col">Aksi</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <p id="info">Belum ada barang retur di list.</p>

            <button id="proses" type="submit" form="form-dokumen" disabled>Proses Retur</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
